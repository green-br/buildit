packages:
  all:
    providers:
      c: [gcc, nvhpc, cce]
      cxx: [gcc, nvhpc, cce]
      fortran: [gcc, nvhpc, cce]
      fftw-api: [cray-fftw, fftw, nvpl-fft]
      blas: [cray-libsci, blis, openblas]
      lapack: [cray-libsci, openblas]
      mpi: [cray-mpich, openmpi]
      pkgconfig: [pkg-config]
    variants: +cuda cuda_arch=90
    permissions:
      write: group
  gcc:
    externals:
    - spec: gcc@14.3.0 languages='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-14
          cxx: /usr/bin/g++-14
          fortran: /usr/bin/gfortran-14
        flags: {}

  cce:
    externals:
    - spec: cce@21.0.0
      prefix: /opt/cray/pe/cce/21.0.0
      extra_attributes:
        compilers:
          c: /opt/cray/pe/cce/21.0.0/bin/craycc
          cxx: /opt/cray/pe/cce/21.0.0/bin/craycxx
          fortran: /opt/cray/pe/cce/21.0.0/bin/crayftn
        # Not supported in archspec so specify here.
        flags:
          cflags: -target-cpu=arm-grace
          cxxflags: -target-cpu=arm-grace
          fflags: -target-cpu=arm-grace
  nvhpc:
    externals:
    - spec: nvhpc@25.9
      prefix: /opt/nvidia/hpc_sdk/Linux_aarch64/25.9/compilers
      extra_attributes:
        compilers:
          c: /opt/nvidia/hpc_sdk/Linux_aarch64/25.9/compilers/bin/nvc
          cxx: /opt/nvidia/hpc_sdk/Linux_aarch64/25.9/compilers/bin/nvc++
          fortran: /opt/nvidia/hpc_sdk/Linux_aarch64/25.9/compilers/bin/nvfortran
        flags:
          cflags: --gcc-toolchain=/usr/bin/gcc-14
          cxxflags: --gcc-toolchain=/usr/bin/gcc-14
  numactl:
    require:
    - "%gcc"
  xz:
    require:
    - "%gcc"
  openmpi:
    variants: +cuda fabrics=ofi cuda_arch=90 schedulers=slurm +pmi +legacylaunchers
  mpich:
    variants: +cuda+fortran~hydra pmi=cray device=ch4 netmod=ofi cuda_arch=90
  cray-libsci:
    buildable: false
    version: [26.03.0]
    externals:
    - spec: cray-libsci@26.03.0 %gcc@14.3
      prefix: /opt/cray/pe/libsci/26.03.0/GNU/13.2/aarch64
    - spec: cray-libsci@26.03.0 %nvhpc@25.9
      prefix: /opt/cray/pe/libsci/26.03.0/NVIDIA/25.9/aarch64
    - spec: cray-libsci@26.03.0 %cce@21.0.0
      prefix: /opt/cray/pe/libsci/26.03.0/CRAY/20.0/aarch64
  cray-mpich:
    buildable: false
    version: [9.1.0]
    externals:
    - spec: cray-mpich@9.1.0 %gcc@14.3 %libfabric
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/GNU/12.3
    - spec: cray-mpich@9.1.0 %nvhpc@25.9 %libfabric
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/NVIDIA/25.9
    - spec: cray-mpich@9.1.0 %cce@21.0.0 %libfabric
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/CRAY/20.0
  cuda:
    buildable: false
    version: [13.0.48]
    externals:
    - spec: cuda@13.0.48
      prefix: /opt/nvidia/hpc_sdk/Linux_aarch64/25.9/cuda/13.0
  libfabric:
    buildable: false
    version: [2.3.1]
    externals:
    - spec: libfabric@2.3.1
      prefix: /opt/cray/libfabric/2.3.1
      modules: [libfabric/2.3.1]
      extra_attributes:
        environment:
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/2.3.1/lib64/
  cray-pmi:
    buildable: false
    version: [6.1.17]
    externals:
    - spec: cray-pmi@6.1.17
      prefix: /opt/cray/pe/pmi/6.1.17
      modules: [cray-pmi/6.1.17]
  python:
    externals:
    - spec: python@3.12.12
      prefix: /opt/cray/pe/python/3.12.12
      modules: [cray-python/3.12.12]
  slurm:
    externals:
    - spec: slurm@25.11.6
      prefix: /usr
  autoconf:
    externals:
    - prefix: /usr
      spec: autoconf@2.69
  automake:
    externals:
    - prefix: /usr
      spec: automake@1.15.1
  binutils:
    externals:
    - prefix: /usr
      spec: binutils@2.43.1~gold~headers
  bison:
    externals:
    - prefix: /usr
      spec: bison@3.0.4
  cmake:
    externals:
    - prefix: /usr
      spec: cmake@3.28.3
  coreutils:
    externals:
    - prefix: /usr
      spec: coreutils@8.32
  curl:
    externals:
    - prefix: /usr
      spec: curl@8.14.1+gssapi+ldap+nghttp2
  diffutils:
    externals:
    - prefix: /usr
      spec: diffutils@3.6
  findutils:
    externals:
    - prefix: /usr
      spec: findutils@4.10.0
  flex:
    externals:
    - prefix: /usr
      spec: flex@2.6.4+lex
  gawk:
    externals:
    - prefix: /usr
      spec: gawk@4.2.1
  gettext:
    externals:
    - prefix: /usr
      spec: gettext@0.21.1
  git:
    externals:
    - prefix: /usr
      spec: git@2.51.0~tcltk
  gmake:
    externals:
    - prefix: /usr
      spec: gmake@4.2.1
  groff:
    externals:
    - prefix: /usr
      spec: groff@1.22.4
  libtool:
    externals:
    - prefix: /usr
      spec: libtool@2.4.6
  m4:
    externals:
    - prefix: /usr
      spec: m4@1.4.18
  openssh:
    externals:
    - prefix: /usr
      spec: openssh@9.6p1
  openssl:
    externals:
    - prefix: /usr
      spec: openssl@3.2.3
  perl:
    externals:
    - prefix: /usr
      spec: perl@5.26.1~cpanm+opcode+open+shared+threads
  pkg-config:
    externals:
    - prefix: /usr
      spec: pkg-config@0.29.2
  sed:
    externals:
    - prefix: /usr
      spec: sed@4.9
  tar:
    externals:
    - prefix: /usr
      spec: tar@1.34
  zlib:
    externals:
    - prefix: /usr
      spec: zlib@1.2.13
